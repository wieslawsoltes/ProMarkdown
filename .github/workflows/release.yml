name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Is this a pre-release?"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
      tag-name: ${{ steps.version.outputs.tag-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
            IS_PRERELEASE="$REQUESTED_PRERELEASE"
            TAG_NAME="v$VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="$GITHUB_REF_NAME"
            IS_PRERELEASE="false"
          fi

          version_pattern='^([0-9]+\.){2,3}[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $version_pattern ]]; then
            echo "::error::Expected a NuGet version such as 0.2.3 or 0.2.3-rc.1."
            exit 1
          fi

          if [[ "${VERSION%%+*}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          if tag_commit=$(git rev-parse --verify --quiet "refs/tags/$TAG_NAME^{commit}") &&
            [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            printf '::error::Release tag %s points to a different commit.\n' "$TAG_NAME"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "is-prerelease=$IS_PRERELEASE"
            echo "tag-name=$TAG_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (prerelease: $IS_PRERELEASE)"

      - name: Restore
        run: dotnet restore ProMarkdown.slnx

      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build ProMarkdown.slnx -c Release --no-restore -p:Version="$RELEASE_VERSION"

  test:
    name: Test Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore ProMarkdown.slnx

      - name: Build
        run: dotnet build ProMarkdown.slnx -c Release --no-restore -p:Version="$RELEASE_VERSION"

      - name: Test
        run: dotnet test --solution ProMarkdown.slnx --configuration Release --no-build --report-xunit-trx --results-directory artifacts/test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: artifacts/test/**/*.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Release Test Results
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  pack:
    name: Pack Release
    runs-on: ubuntu-latest
    needs: [build, test]
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore ProMarkdown.slnx

      - name: Build
        run: dotnet build ProMarkdown.slnx -c Release --no-restore -p:Version="$RELEASE_VERSION"

      - name: Pack
        run: dotnet pack ProMarkdown.slnx -c Release --no-build -p:Version="$RELEASE_VERSION" -o artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: release-nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 90

  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [build, pack]
    environment: nuget
    permissions:
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-nuget-packages
          path: packages

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x

      - name: Sign in to NuGet.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          nuget_source=https://api.nuget.org/v3/index.json
          dotnet nuget push "packages/*.nupkg" \
            --source "$nuget_source" --api-key "$NUGET_API_KEY" --no-symbols --skip-duplicate
          # Retry symbol uploads even when a previous run already uploaded the packages.
          dotnet nuget push "packages/*.snupkg" \
            --source "$nuget_source" --api-key "$NUGET_API_KEY" --skip-duplicate

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, pack, publish-nuget]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: release-nuget-packages
          path: packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ProMarkdown v${{ needs.build.outputs.version }}
          tag_name: ${{ needs.build.outputs.tag-name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ needs.build.outputs.is-prerelease == 'true' }}
          generate_release_notes: true
          files: |
            packages/*.nupkg
            packages/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
